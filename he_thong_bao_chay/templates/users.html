<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng & Phân Quyền | Hệ Thống Báo Cháy IoT</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(18, 26, 43, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent-fire: #ff3b30;
            --accent-fire-glow: rgba(255, 59, 48, 0.35);
            --accent-warn: #ff9500;
            --accent-safe: #30d158;
            --accent-blue: #0a84ff;
            --accent-telegram: #229ED9;
            --text-primary: #f5f7fa;
            --text-secondary: #9ba3b4;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 59, 48, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(10, 132, 255, 0.05) 0%, transparent 40%);
        }

        /* Top Navigation Header */
        header {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0a84ff, #229ED9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(10, 132, 255, 0.35);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--bg-card-border);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
            width: 280px;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--bg-card-border);
        }

        th {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 0.9rem;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .role-admin {
            background: rgba(10, 132, 255, 0.2);
            color: #0a84ff;
            border: 1px solid rgba(10, 132, 255, 0.4);
        }

        .role-operator {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.4);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .action-btn.delete {
            color: var(--accent-fire);
            border-color: rgba(255, 59, 48, 0.3);
        }

        .action-btn.delete:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .custom-input, .custom-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--bg-card-border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 0.88rem;
            outline: none;
        }

        .custom-select {
            background: rgba(18, 26, 43, 0.95);
        }

        /* Toast Notifications */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(18, 26, 43, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            animation: slideIn 0.3s ease;
        }

        .toast.success { border-left: 4px solid var(--accent-safe); }
        .toast.error { border-left: 4px solid var(--accent-fire); }
        .toast.info { border-left: 4px solid var(--accent-blue); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-users-gear"></i>
            </div>
            <div>
                <h1 style="font-size: 1.15rem; font-weight: 700;">QUẢN LÝ NGƯỜI DÙNG & PHÂN QUYỀN</h1>
                <p style="font-size: 0.8rem; color: var(--text-secondary);">Trung tâm kiểm soát tài khoản hệ thống PCCC</p>
            </div>
        </div>

        <div class="header-actions">
            <div class="nav-btn" style="background: rgba(10, 132, 255, 0.12); border-color: rgba(10, 132, 255, 0.3); pointer-events: none;">
                <i class="fa-solid fa-user-shield" style="color: var(--accent-blue);"></i>
                <span style="font-weight: 700; color: #fff;">{{ user.fullname or user.username }}</span>
                <span style="font-size: 0.72rem; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; color: var(--accent-blue); font-weight: 800;">ADMIN</span>
            </div>
            <a href="/" class="nav-btn">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>
            <a href="/history" class="nav-btn">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử
            </a>
            <a href="/logout" class="nav-btn" style="color: #ff3b30; border-color: rgba(255,59,48,0.3);">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất
            </a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="toolbar">
                <input type="text" class="search-input" id="searchBox" placeholder="Tìm theo tên hoặc username..." onkeyup="filterUsers()">
                <div style="display: flex; gap: 10px;">
                    <button class="nav-btn" style="background: linear-gradient(135deg, #0a84ff, #229ED9); color: #fff;" onclick="openCreateUserModal()">
                        <i class="fa-solid fa-user-plus"></i> Thêm Tài Khoản
                    </button>
                    <button class="nav-btn" onclick="loadUsers()">
                        <i class="fa-solid fa-rotate-right"></i> Làm Mới
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Họ & Tên</th>
                            <th>Username</th>
                            <th>Phân Quyền</th>
                            <th>Telegram Chat ID</th>
                            <th>Ngày Tạo</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 40px;">
                                Đang tải danh sách người dùng...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Người Dùng Mới -->
    <div class="modal-overlay" id="modalCreateUser">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 1.1rem; font-weight: 700; color: #fff;"><i class="fa-solid fa-user-plus" style="color: var(--accent-blue);"></i> Tạo Tài Khoản Mới</h3>
                <button onclick="closeCreateUserModal()" style="background: transparent; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer;">&times;</button>
            </div>

            <form onsubmit="handleCreateUser(event)">
                <div class="form-group">
                    <label class="form-label">Họ và Tên</label>
                    <input type="text" id="newFullname" class="custom-input" placeholder="Ví dụ: Trần Văn A" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập (Username)</label>
                    <input type="text" id="newUsername" class="custom-input" placeholder="Tên đăng nhập..." required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="newPassword" class="custom-input" placeholder="Tối thiểu 6 ký tự..." required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label">Phân Quyền</label>
                    <select id="newRole" class="custom-select">
                        <option value="OPERATOR">🛡️ Kỹ Thuật Viên Vận Hành (Operator)</option>
                        <option value="ADMIN">👑 Quản Trị Viên (Admin)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Telegram Chat ID (Tùy chọn)</label>
                    <input type="text" id="newTelegram" class="custom-input" placeholder="Ví dụ: 672968192">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="nav-btn" onclick="closeCreateUserModal()">Hủy</button>
                    <button type="submit" class="nav-btn" style="background: linear-gradient(135deg, #0a84ff, #229ED9); color: #fff;">Tạo Tài Khoản</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        let allUsers = [];
        const currentUserId = {{ user.id }};

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = '<i class="fa-solid fa-circle-info" style="color: #229ED9;"></i>';
            if (type === 'success') icon = '<i class="fa-solid fa-circle-check" style="color: #30d158;"></i>';
            if (type === 'error') icon = '<i class="fa-solid fa-circle-exclamation" style="color: #ff3b30;"></i>';
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                if (data.status === 'success') {
                    allUsers = data.users;
                    renderUsers(allUsers);
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('Lỗi tải danh sách: ' + err.message, 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 40px;">Không tìm thấy người dùng nào.</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(u => {
                const isAdmin = u.role === 'ADMIN';
                const roleClass = isAdmin ? 'role-admin' : 'role-operator';
                const roleIcon = isAdmin ? '<i class="fa-solid fa-crown"></i>' : '<i class="fa-solid fa-shield"></i>';
                const isSelf = u.id === currentUserId;

                return `
                    <tr>
                        <td style="font-family: var(--font-mono); color: var(--text-secondary); font-weight: 700;">#${u.id}</td>
                        <td style="font-weight: 700;">${u.fullname || u.username} ${isSelf ? '<span style="color: var(--accent-safe); font-size: 0.75rem;">(Bạn)</span>' : ''}</td>
                        <td style="font-family: var(--font-mono); color: var(--accent-blue);">@${u.username}</td>
                        <td>
                            <span class="role-badge ${roleClass}">${roleIcon} ${u.role}</span>
                        </td>
                        <td style="font-family: var(--font-mono); color: var(--accent-telegram);">
                            ${u.telegram_chat_id ? `<i class="fa-brands fa-telegram"></i> ${u.telegram_chat_id}` : '<span style="color: var(--text-secondary);">--</span>'}
                        </td>
                        <td style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-secondary);">${u.created_at}</td>
                        <td>
                            <div style="display: flex; gap: 8px;">
                                <button class="action-btn" onclick="toggleUserRole(${u.id}, '${u.role}')" title="Đổi quyền Admin / Operator">
                                    <i class="fa-solid fa-arrows-rotate"></i> Đổi Quyền
                                </button>
                                ${!isSelf ? `
                                    <button class="action-btn delete" onclick="deleteUser(${u.id}, '${u.username}')" title="Xóa tài khoản">
                                        <i class="fa-solid fa-trash-can"></i> Xóa
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterUsers() {
            const q = document.getElementById('searchBox').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.fullname && u.fullname.toLowerCase().includes(q)) ||
                u.username.toLowerCase().includes(q) ||
                u.role.toLowerCase().includes(q)
            );
            renderUsers(filtered);
        }

        async function toggleUserRole(userId, currentRole) {
            const nextRole = currentRole === 'ADMIN' ? 'OPERATOR' : 'ADMIN';
            if (!confirm(`Bạn có chắc chắn muốn đổi quyền của tài khoản này sang "${nextRole}"?`)) return;

            try {
                const res = await fetch('/api/admin/users/role', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, role: nextRole })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('✅ ' + data.message, 'success');
                    loadUsers();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, 'error');
            }
        }

        async function deleteUser(userId, username) {
            if (!confirm(`⚠️ BẠN CÓ CHẮC MUỐN XÓA TÀI KHOẢN "@${username}" KHÔNG? Hành động này không thể hoàn tác!`)) return;

            try {
                const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('✅ ' + data.message, 'success');
                    loadUsers();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, 'error');
            }
        }

        function openCreateUserModal() {
            document.getElementById('modalCreateUser').style.display = 'flex';
        }

        function closeCreateUserModal() {
            document.getElementById('modalCreateUser').style.display = 'none';
        }

        async function handleCreateUser(e) {
            e.preventDefault();
            const fullname = document.getElementById('newFullname').value.trim();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            const telegram_chat_id = document.getElementById('newTelegram').value.trim();

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, username, password, role, telegram_chat_id })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('✅ Đã tạo tài khoản mới thành công!', 'success');
                    closeCreateUserModal();
                    loadUsers();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Lỗi: ' + err.message, 'error');
            }
        }

        loadUsers();
    </script>
</body>
</html>
